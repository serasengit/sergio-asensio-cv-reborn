version: '3'
services:
    dependencies:
        container_name: sergio-asensio-cv-app-dev-dependencies
        image: sergio-asensio-cv-app-dev-dependencies
    integration-tests:
        container_name: sergio-asensio-cv-app-dev-integration-tests
        image: sergio-asensio-cv-app-dev-integration-tests
    release:
        container_name: sergio-asensio-cv-app-dev-release
        image: sergio-asensio-cv-app-dev-release
        build:
            args:
                CONFIGURATION: dev
    nginx:
        container_name: sergio-asensio-cv-app-dev-app
        image: sergio-asensio-cv-app-dev-app
        build:
            args:
                CONFIGURATION: dev
