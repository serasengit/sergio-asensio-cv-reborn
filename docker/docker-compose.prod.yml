version: '3'
services:
    dependencies:
        container_name: sergio-asensio-cv-app-prod-dependencies
        image: sergio-asensio-cv-app-prod-dependencies
    integration-tests:
        container_name: sergio-asensio-cv-app-prod-integration-tests
        image: sergio-asensio-cv-app-prod-integration-tests
    release:
        container_name: sergio-asensio-cv-app-prod-release
        image: sergio-asensio-cv-app-prod-release
        build:
            args:
                CONFIGURATION: prod
    nginx:
        container_name: sergio-asensio-cv-app-prod-app
        image: sergio-asensio-cv-app-prod-app
        build:
            args:
                CONFIGURATION: prod
