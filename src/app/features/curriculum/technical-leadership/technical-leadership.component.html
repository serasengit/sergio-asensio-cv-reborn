<div id="technical_leadership" class="technical-leadership pt-4">
    <h1 class="technical-leadership__title fw-bold fs-3 text-secondary text-center">
        {{ 'technical_leadership' | translate }}
    </h1>

    <hr />

    <div class="container px-0">
        <div class="row g-4">
            <div
                class="col-12 col-md-6"
                *ngFor="let item of 'curriculum_page.technical_leadership_section.content' | translate; let i = index"
            >
                <div class="technical-leadership__card h-100 rounded-4 p-4">
                    <div class="d-flex align-items-start gap-3">
                        <div class="technical-leadership__icon">
                            <mat-icon>{{ technicalLeadershipIcons[i] }}</mat-icon>
                        </div>

                        <div>
                            <h2 class="technical-leadership__card-title fw-bold fs-6 mb-2">
                                {{ technicalLeadershipTitleKeys[i] | translate }}
                            </h2>

                            <p class="technical-leadership__card-text mb-0 lh-lg">
                                {{ item }}
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
